<h1 class="text-center rounded">OBMC Enrollment Form</h1>
<br>

<div class="container">
    <div class="row">
        <div class="col-lg-12 bg-light opacity-80 p-4 rounded">
            <h2>Student Information</h2>
            <p>Please fill out the form below to enroll your child in our academic programs.</p>
    <form>
        <label for="name">First Name</label>
        <input type="text" id="name" name="name" required>
        <label for="name">Last Name</label>
        <input type="text" id="name" name="name" required>
        <br>

        <label for="date">Birth Date</label>
        <input type="date" id="date" name="date" required>
        <label for="Gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <label for="grade">Grade Level</label>
        <select id="grade" name="grade" required>
            <option value="">Select Grade</option>
            <option value="7">1st Grade</option>
            <option value="8">2nd Grade</option>
            <option value="9">3rd Grade</option>
            <option value="10">4th Grade</option>
            <option value="11">5th Grade</option>
            <option value="12">6th Grade</option>
            <option value="7">7th Grade</option>
            <option value="8">8th Grade</option>
            <option value="9">9th Grade</option>
            <option value="10">10th Grade</option>
            <option value="11">11th Grade</option>
            <option value="12">12th Grade</option>
        </select>

    <br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="radio">MODE OF LEARNING</label>
            <input type="radio" id="Online" name="Mode of Learning" value="Online" required>
            <label for="Online">Online</label>
            <input type="radio" id="Onsite" name="Mode of Learning" value="Onsite">
            <label for="Onsite">Onsite</label>
            <input type="radio" id="Mixed" name="Mode of Learning" value="Mixed">
            <label for="Mixed">Mixed</label>

        <br><br> 

            <input type="radio" id="Confirmation" name="Confirmation" value="Confirmation" required>
            <label for="Confirmation">I confirm the information provided is accurate.</label>

            <br><br>
        <input type="submit" value="Enroll">
    </form>
<br>
